{% extends 'layout.html' %}

{% block title %}Contact - FeelCam{% endblock %}

{% block head %}
<style>
    .contact-page {
        padding: 60px 5%;
        max-width: 800px;
        margin: 0 auto;
        text-align: center;
    }

    .contact-form {
        text-align: left;
        margin-top: 40px;
    }

    textarea.form-control {
        min-height: 150px;
        resize: vertical;
    }
</style>
{% endblock %}

{% block content %}
<div class="contact-page">
    <h1 class="hero-title">Get in <span>Touch</span></h1>
    <p class="text-muted">Have questions about our AI technology? We're here to help.</p>

    <div class="glass-container contact-form">
        <form action="{{ url_for('contact') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Your Name</label>
                <input type="text" name="name" class="form-control" placeholder="Jane Doe" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="jane@example.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Message</label>
                <textarea name="message" class="form-control" placeholder="How can we help you?" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-full mt-2">
                Send Message <i class="fas fa-paper-plane ml-2"></i>
            </button>
        </form>
    </div>
</div>
{% endblock %}
