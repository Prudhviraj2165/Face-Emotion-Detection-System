{% extends 'layout.html' %}

{% block title %}Sign Up - FeelCam{% endblock %}

{% block head %}
<style>
    body {
        background: linear-gradient(225deg, var(--primary-color) 0%, var(--accent-color) 100%);
    }

    nav { display: none; }

    .register-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 100vh;
        padding: 20px;
    }

    .register-container {
        display: flex;
        flex-direction: row-reverse;
        width: 100%;
        max-width: 900px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        min-height: 520px;
    }

    .register-image {
        flex: 1;
        position: relative;
        overflow: hidden;
        display: none;
    }

    @media (min-width: 768px) {
        .register-image { display: block; }
    }

    .register-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.75;
    }

    .register-form-area {
        flex: 1.1;
        padding: 36px 40px;
        background: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .register-form-area h3 {
        font-size: 1.6rem;
        color: var(--primary-color);
        font-weight: 700;
        margin-bottom: 4px;
    }

    .register-form-area > p {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-bottom: 20px;
    }

    /* Compact form fields */
    .reg-group {
        margin-bottom: 12px;
    }

    .reg-label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--secondary-color);
        margin-bottom: 4px;
    }

    .reg-input {
        width: 100%;
        padding: 10px 14px;
        border: 1.5px solid #e1e5eb;
        border-radius: 10px;
        background: white;
        font-size: 0.9rem;
        color: var(--text-main);
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .reg-input:focus {
        outline: none;
        border-color: var(--accent-color);
        box-shadow: 0 0 0 3px rgba(65, 90, 119, 0.1);
    }

    .reg-input::placeholder {
        color: #b0b8c4;
    }

    .btn-register {
        width: 100%;
        padding: 12px;
        font-size: 1rem;
        margin-top: 16px;
        margin-bottom: 14px;
    }

    .signin-link {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.85rem;
    }

    .signin-link a {
        color: var(--primary-color);
        font-weight: 700;
        text-decoration: none;
    }

    .signin-link a:hover { text-decoration: underline; }
</style>
{% endblock %}

{% block content %}
<div class="register-wrapper">
    <div class="register-container">
        <div class="register-image">
            <img src="{{ url_for('static', filename='image2.jpeg') }}" alt="Join FeelCam">
        </div>

        <div class="register-form-area">
            <h3>Create Account</h3>
            <p>Start analyzing emotions with FeelCam today.</p>

            <form method="POST" action="{{ url_for('register') }}">
                <div class="reg-group">
                    <label class="reg-label" for="name">Full Name</label>
                    <input type="text" id="name" name="name" class="reg-input" placeholder="John Doe" required>
                </div>

                <div class="reg-group">
                    <label class="reg-label" for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="reg-input" placeholder="john@example.com" required>
                </div>

                <div class="reg-group">
                    <label class="reg-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="reg-input" placeholder="Create a password" required>
                </div>

                <div class="reg-group">
                    <label class="reg-label" for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" class="reg-input" placeholder="Repeat password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-register">
                    Sign Up <i class="fas fa-user-plus"></i>
                </button>
            </form>

            <div class="signin-link">
                Already have an account? <a href="{{ url_for('login') }}">Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
